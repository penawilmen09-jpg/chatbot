name: WILMEN ADVENTURE - Prueba de render (pantalla completa, varias resoluciones)

# Dibuja el juego con Godot + Mesa (GPU por software) bajo Xvfb en 9 relaciones de aspecto y mide los
# píxeles que no cubre ningún fondo/escenario (franjas negras). Guarda capturas como artefacto.
on:
  workflow_dispatch:
  push:
    paths:
      - "wilmen-adventure/**"
      - ".github/workflows/wilmen-render-test.yml"

env:
  GODOT_VERSION: "4.3"

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: wilmen-adventure
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias gráficas (Xvfb, Mesa)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libegl1 libxcursor1 libxinerama1 libxi6 libxrandr2 libxkbcommon0 libasound2
          mkdir -p /tmp/shots

      - name: Descargar Godot
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo mv /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

      - name: Importar recursos
        run: |
          godot --headless --path . --import || true
          godot --headless --path . --import

      - name: Línea base - fondo ANTIGUO (informativo, no bloquea)
        continue-on-error: true
        run: |
          export LIBGL_ALWAYS_SOFTWARE=1
          for RES in 2000x933 1600x720 2400x1080; do
            echo "################ ANTIGUO $RES"
            xvfb-run -a -s "-screen 0 3400x1700x24" godot --path . --resolution $RES --rendering-driver opengl3 --audio-driver Dummy --script res://tests/render_test.gd -- --legacy-parallax 2>&1 | tee -a /tmp/render_legacy.log | grep -E "==|FALLO|CAPTURAS|RESULTADO|M1 inicio" || true
          done

      - name: Rotación vertical -> horizontal con el nivel ya creado (fondo ANTIGUO, informativo)
        continue-on-error: true
        run: |
          export LIBGL_ALWAYS_SOFTWARE=1
          echo "################ ANTIGUO rotación"
          xvfb-run -a -s "-screen 0 3400x1700x24" godot --path . --resolution 933x2000 --rendering-driver opengl3 --audio-driver Dummy --script res://tests/render_test.gd -- --rotate --legacy-parallax 2>&1 | tee -a /tmp/render_legacy.log | grep -E "==|RENDER|CAPTURAS|RESULTADO" || true
          echo "################ ANTIGUO redimensionado en vivo"
          xvfb-run -a -s "-screen 0 3400x1700x24" godot --path . --resolution 1280x720 --rendering-driver opengl3 --audio-driver Dummy --script res://tests/render_test.gd -- --live --legacy-parallax 2>&1 | tee -a /tmp/render_legacy.log | grep -E "==|RENDER|CAPTURAS|RESULTADO" || true

      - name: Rotación vertical -> horizontal (fondo NUEVO, bloquea)
        run: |
          export LIBGL_ALWAYS_SOFTWARE=1
          echo "################ NUEVO rotación"
          xvfb-run -a -s "-screen 0 3400x1700x24" godot --path . --resolution 933x2000 --rendering-driver opengl3 --audio-driver Dummy --script res://tests/render_test.gd -- --rotate 2>&1 | tee -a /tmp/render.log | grep -E "==|RENDER|CAPTURAS|RESULTADO" || true
          tail -n 12 /tmp/render.log | grep -q "RESULTADO: TODO OK"

      - name: Prueba de render en 11 relaciones de aspecto (un proceso de Godot por resolución)
        run: |
          export LIBGL_ALWAYS_SOFTWARE=1
          FAIL=0
          for RES in 1280x720 2000x933 1600x720 2400x1080 2340x1080 2560x1080 2960x1440 3200x1440 1920x1200 1600x1200 800x480; do
            echo "################ $RES"
            xvfb-run -a -s "-screen 0 3400x1700x24" godot --path . --resolution $RES --rendering-driver opengl3 --audio-driver Dummy --script res://tests/render_test.gd 2>&1 | tee -a /tmp/render.log | grep -E "==|FALLO|CAPTURAS|RESULTADO" || true
            tail -n 12 /tmp/render.log | grep -q "RESULTADO: TODO OK" || FAIL=1
          done
          echo "################ redimensionado en vivo (como al rotar en Android)"
          xvfb-run -a -s "-screen 0 3400x1700x24" godot --path . --resolution 1280x720 --rendering-driver opengl3 --audio-driver Dummy --script res://tests/render_test.gd -- --live 2>&1 | tee -a /tmp/render.log | grep -E "==|FALLO|CAPTURAS|RESULTADO" || true
          tail -n 12 /tmp/render.log | grep -q "RESULTADO: TODO OK" || FAIL=1
          echo "líneas con FALLO: $(grep -c 'FALLO' /tmp/render.log)"
          exit $FAIL

      - name: Capturas y registro
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wilmen-render-shots
          path: |
            /tmp/shots
            /tmp/render.log
            /tmp/render_legacy.log
            /tmp/render.log
          if-no-files-found: ignore
