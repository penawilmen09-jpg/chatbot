name: WILMEN ADVENTURE - Pruebas y APK de Android

# 1) Valida los 100 niveles y ejecuta las pruebas en Godot 4.3 headless (bloqueante).
# 1b) Prueba de render en pantalla (Xvfb + Mesa) en 11 relaciones de aspecto: sin franjas sin cubrir (bloqueante).
# 2) Si pasan, exporta el APK RELEASE de Android y lo publica como artefacto descargable.
# Cada ejecución genera una versión nueva (version code = 100 + número de ejecución), firmada con la
# misma clave, así que cada APK se instala encima del anterior.
on:
  workflow_dispatch:
  push:
    paths:
      - "wilmen-adventure/**"
      - ".github/workflows/wilmen-android-apk.yml"

env:
  GODOT_VERSION: "4.3"

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: wilmen-adventure
    steps:
      - uses: actions/checkout@v4

      - name: Validar los 100 niveles (alcanzabilidad, gemas, duplicados)
        run: python3 tools/levelgen.py --check

      - name: Validar los niveles de WILMEN WORLD (llaves, túneles, puertas, reloj)
        run: python3 tools/ww_check.py

      - name: Descargar Godot
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo mv /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --headless --version

      - name: Importar recursos
        run: |
          godot --headless --path . --import 2>&1 | tail -n 100 || true
          godot --headless --path . --import 2>&1 | tee /tmp/import.log
          if grep -E "SCRIPT ERROR|Parse Error|ERROR: " /tmp/import.log | grep -v "resources still in use"; then echo "Errores al importar"; exit 1; fi

      - name: Batería de pruebas (100 niveles, desbloqueo, música, jefes, mecánicas...)
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/smoke_test.gd 2>&1 | tee /tmp/smoke.log
          echo "---- resumen ----"
          grep -c "  ok   " /tmp/smoke.log | sed 's/^/comprobaciones ok: /'
          grep "FALLO" /tmp/smoke.log || true
          if grep -E "SCRIPT ERROR|Parse Error|FALLO|ERROR:" /tmp/smoke.log | grep -v -E "resources still in use|RID allocations of type"; then echo "Errores detectados"; exit 1; fi
          grep -q "RESULTADO: TODO OK" /tmp/smoke.log

      - name: Persistencia entre dos ejecuciones reales (cerrar y abrir el juego)
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/persist_write.gd 2>&1 | tee /tmp/pw.log
          godot --headless --path . --script res://tests/persist_check.gd 2>&1 | tee /tmp/pc.log
          if grep -E "SCRIPT ERROR|Parse Error|FALLO" /tmp/pw.log /tmp/pc.log; then exit 1; fi
          grep -q "TODO OK" /tmp/pc.log

      - name: Flujo real (mapa, niveles anteriores, cambio de mundo, sin congelarse)
        if: always()
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/flow_test.gd 2>&1 | tee /tmp/flow.log
          grep "FALLO" /tmp/flow.log || true
          if grep -E "Infinite loop|Target object freed|SCRIPT ERROR|Parse Error|FALLO" /tmp/flow.log; then echo "Errores en el flujo"; exit 1; fi
          grep -q "RESULTADO: TODO OK" /tmp/flow.log

      - name: Registros de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wilmen-test-logs
          path: |
            /tmp/import.log
            /tmp/smoke.log
            /tmp/pw.log
            /tmp/pc.log
            /tmp/flow.log
          if-no-files-found: ignore

  render:
    # Dibuja el juego de verdad (Godot + Mesa bajo Xvfb) y comprueba que ningún fondo deja zonas sin cubrir
    # y que la cámara nunca muestra nada fuera del nivel, en 11 relaciones de aspecto, al rotar y al redimensionar.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: wilmen-adventure
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias gráficas (Xvfb, Mesa)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libegl1 libxcursor1 libxinerama1 libxi6 libxrandr2 libxkbcommon0 libasound2
          mkdir -p /tmp/shots

      - name: Descargar Godot
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo mv /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

      - name: Importar recursos
        run: |
          godot --headless --path . --import || true
          godot --headless --path . --import

      - name: Render en 11 resoluciones, rotación vertical-horizontal y redimensionado en vivo
        run: |
          export LIBGL_ALWAYS_SOFTWARE=1
          FAIL=0
          run_one() {
            echo "################ $*"
            xvfb-run -a -s "-screen 0 3400x1700x24" godot --path . --rendering-driver opengl3 --audio-driver Dummy "$@" 2>&1 | tee -a /tmp/render.log | grep -E "==|FALLO|CAPTURAS|RESULTADO" || true
            tail -n 12 /tmp/render.log | grep -q "RESULTADO: TODO OK" || FAIL=1
          }
          for RES in 1280x720 2000x933 1600x720 2400x1080 2340x1080 2560x1080 2960x1440 3200x1440 1920x1200 1600x1200 800x480; do
            run_one --resolution $RES --script res://tests/render_test.gd
          done
          run_one --resolution 933x2000 --script res://tests/render_test.gd -- --rotate
          run_one --resolution 1280x720 --script res://tests/render_test.gd -- --live
          echo "líneas con FALLO: $(grep -c 'FALLO' /tmp/render.log)"
          if grep -E "SCRIPT ERROR|Parse Error" /tmp/render.log; then echo "Errores de script al dibujar"; FAIL=1; fi
          exit $FAIL

      - name: Capturas y registro
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wilmen-render-logs
          path: |
            /tmp/shots
            /tmp/render.log
          if-no-files-found: ignore

  apk:
    needs: [test, render]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: wilmen-adventure
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: SDK de Android (preinstalado en el runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -n 1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Descargar Godot y plantillas de exportación
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O /tmp/templates.tpz
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo mv /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Firma (clave estable) y ajustes del editor
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$HOME/release.keystore"
            echo "KS_PATH=$HOME/release.keystore" >> "$GITHUB_ENV"
            echo "KS_USER=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "KS_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "Usando la clave de firma de los secrets"
          else
            echo "KS_PATH=$PWD/android/wilmen-sideload.keystore" >> "$GITHUB_ENV"
            echo "KS_USER=wilmen" >> "$GITHUB_ENV"
            echo "KS_PASSWORD=wilmenadventure" >> "$GITHUB_ENV"
            echo "Usando la clave de instalación directa del repositorio (android/README.md)"
          fi
          # clave de depuración para el editor (requerida por el exportador aunque se exporte en release)
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore "$HOME/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p ~/.config/godot
          for f in editor_settings-4.3.tres editor_settings-4.tres; do
            cat > ~/.config/godot/$f <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          done

      - name: Versión de esta compilación
        run: |
          CODE=$((100 + ${{ github.run_number }}))
          sed -i "s/^version\/code=.*/version\/code=${CODE}/" export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"2.0.${{ github.run_number }}\"/" export_presets.cfg
          grep -E "^version/" export_presets.cfg

      - name: Importar recursos
        run: |
          godot --headless --path . --import || true
          godot --headless --path . --import

      - name: Exportar APK release
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ env.KS_PATH }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ env.KS_USER }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ env.KS_PASSWORD }}
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Android" build/WilmenAdventure.apk 2>&1 | tee /tmp/export.log
          ls -la build
          test -s build/WilmenAdventure.apk

      - name: Comprobar el APK (firma, permisos sin Internet, contenido)
        run: |
          BT=$ANDROID_HOME/build-tools/34.0.0
          echo "== permisos =="
          $BT/aapt dump permissions build/WilmenAdventure.apk | tee /tmp/perms.txt
          if grep -q "android.permission.INTERNET" /tmp/perms.txt; then echo "ERROR: el APK pide permiso de Internet"; exit 1; fi
          echo "== firma =="
          $BT/apksigner verify --verbose build/WilmenAdventure.apk | head -n 8
          echo "== datos =="
          $BT/aapt dump badging build/WilmenAdventure.apk | grep -E "package:|sdkVersion|launchable-activity|application-label:" | head
          cp build/WilmenAdventure.apk "build/WilmenAdventure-2.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: WilmenAdventure-APK-2.0.${{ github.run_number }}
          path: wilmen-adventure/build/WilmenAdventure-2.0.${{ github.run_number }}.apk
          if-no-files-found: error

  aab:
    # Paquete AAB para Google Play (compilación Gradle con la plantilla de Android de Godot 4.3).
    needs: [test, render]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: wilmen-adventure
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: SDK de Android (preinstalado) + NDK/CMake que pide la plantilla de Godot
        run: |
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -n 1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platform-tools" "build-tools;34.0.0" "platforms;android-34" "ndk;23.2.8568313" "cmake;3.10.2.4988404"

      - name: Descargar Godot y plantillas de exportación
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O /tmp/templates.tpz
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo mv /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          ls ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable | head -30

      - name: Plantilla de compilación Android (equivale a "Instalar plantilla de compilación de Android")
        run: |
          mkdir -p android/build
          unzip -q ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip -d android/build
          echo "${GODOT_VERSION}.stable" > android/.build_version
          touch android/build/.gdignore
          ls android/build | head -20

      - name: Firma (clave estable) y ajustes del editor
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$HOME/release.keystore"
            echo "KS_PATH=$HOME/release.keystore" >> "$GITHUB_ENV"
            echo "KS_USER=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "KS_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          else
            echo "KS_PATH=$PWD/android/wilmen-sideload.keystore" >> "$GITHUB_ENV"
            echo "KS_USER=wilmen" >> "$GITHUB_ENV"
            echo "KS_PASSWORD=wilmenadventure" >> "$GITHUB_ENV"
          fi
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore "$HOME/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p ~/.config/godot
          for f in editor_settings-4.3.tres editor_settings-4.tres; do
            cat > ~/.config/godot/$f <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          done

      - name: Versión de esta compilación
        run: |
          CODE=$((100 + ${{ github.run_number }}))
          sed -i "s/^version\/code=.*/version\/code=${CODE}/" export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"2.0.${{ github.run_number }}\"/" export_presets.cfg
          grep -E "^version/" export_presets.cfg

      - name: Importar recursos
        run: |
          godot --headless --path . --import || true
          godot --headless --path . --import

      - name: Exportar AAB release (Gradle)
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ env.KS_PATH }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ env.KS_USER }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ env.KS_PASSWORD }}
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Android AAB" build/WilmenAdventure.aab 2>&1 | tee /tmp/aab.log | tail -n 60
          ls -la build
          test -s build/WilmenAdventure.aab

      - name: Comprobar el AAB (contenido, firma, sin permiso de Internet)
        run: |
          unzip -l build/WilmenAdventure.aab | head -25
          unzip -p build/WilmenAdventure.aab base/manifest/AndroidManifest.xml > /tmp/manifest.pb
          if grep -aq "android.permission.INTERNET" /tmp/manifest.pb; then echo "ERROR: el AAB pide permiso de Internet"; exit 1; fi
          grep -ao "android.permission.[A-Z_]*" /tmp/manifest.pb | sort -u
          jarsigner -verify build/WilmenAdventure.aab | head -3
          cp build/WilmenAdventure.aab "build/WilmenAdventure-2.0.${{ github.run_number }}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: WilmenAdventure-AAB-2.0.${{ github.run_number }}
          path: wilmen-adventure/build/WilmenAdventure-2.0.${{ github.run_number }}.aab
          if-no-files-found: error
